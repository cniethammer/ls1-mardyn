name: "CodeQL"

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:

# abort old runs of the same branch or PR if a new one is started
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: cpp
            build-mode: manual
          - language: python
            build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: security-and-quality

    - name: Install dependencies
      if: matrix.build-mode == 'manual'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          ninja-build \
          libopenmpi-dev \
          libcppunit-dev \
          catch2 \
          libxerces-c-dev \
          libadios2-mpi-c++11-dev

    - name: Build ls1
      if: matrix.build-mode == 'manual'
      run: |
        # Debian/Ubuntu installs the ADIOS2 CMake config in a subdirectory that find_package() does not search
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DENABLE_MPI=ON \
          -DENABLE_OPENMP=ON \
          -DENABLE_UNIT_TESTS=ON \
          -DENABLE_VTK=ON \
          -DENABLE_ADIOS2=ON \
          -DADIOS2_DIR=/usr/lib/x86_64-linux-gnu/cmake/adios2/mpi
        cmake --build build

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"
        upload: failure-only
        output: sarif-results

    # Remove alerts in bundled or downloaded third-party code before uploading.
    # paths-ignore of the CodeQL config does not work for compiled languages.
    - name: Filter SARIF
      uses: advanced-security/filter-sarif@v1.1
      with:
        patterns: |
          -dependencies-external/**
          -**/_deps/**
        input: sarif-results/${{ matrix.language }}.sarif
        output: sarif-results/${{ matrix.language }}.sarif

    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: sarif-results/${{ matrix.language }}.sarif
        category: "/language:${{ matrix.language }}"
